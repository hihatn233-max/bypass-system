<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đang xác thực...</title>
    <style>
        body { font-family: Arial; background: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 90%; }
        h2 { color: #333; }
        .btn { background: #007bff; color: white; padding: 12px 20px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; margin-top: 20px; width: 100%; font-weight: bold; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        .timer { font-size: 24px; color: #dc3545; font-weight: bold; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Vui lòng chờ để lấy link</h2>
        <p>Hệ thống đang chuẩn bị link cho bạn...</p>
        <div class="timer" id="timerText">59</div>
        <button class="btn" id="actionBtn" disabled onclick="verify()">Tiếp tục</button>
    </div>
    <script>
        const shortId = window.location.pathname.replace('/', '');
        let timeLeft = 59;
        function startTimer() {
            const timerText = document.getElementById('timerText');
            const btn = document.getElementById('actionBtn');
            const interval = setInterval(() => {
                timeLeft--;
                timerText.innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(interval);
                    timerText.innerText = "Hoàn tất!";
                    btn.disabled = false;
                    btn.innerText = "LẤY LINK GỐC";
                    btn.style.background = "#28a745";
                }
            }, 1000);
        }
        async function verify() {
            document.getElementById('actionBtn').innerText = "Đang chuyển hướng...";
            try {
                const res = await fetch('/api/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: shortId })
                });
                const data = await res.json();
                if (data.success) { window.location.href = data.url; } 
                else { alert('Lỗi: ' + data.error); }
            } catch (e) { alert('Lỗi mạng!'); }
        }
        startTimer();
        document.addEventListener('contextmenu', e => e.preventDefault());
    </script>
</body>
</html>
